<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>站点入口</title>
<style>
  :root {
    --bg: #0b0d12;
    --card: #14171f;
    --card-hover: #1a1e28;
    --line: rgba(255,255,255,0.08);
    --text: #e8ebf2;
    --muted: #8b93a7;
    --accent: #ff6a3d;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    background: var(--bg);
    background-image:
      radial-gradient(900px 500px at 15% -10%, rgba(255,106,61,0.14), transparent 60%),
      radial-gradient(800px 500px at 90% 0%, rgba(58,120,255,0.10), transparent 65%);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
      "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  .wrap {
    max-width: 920px;
    margin: 0 auto;
    padding: 72px 24px 56px;
  }
  header { margin-bottom: 44px; }
  .badge {
    display: inline-block;
    font-size: 12px;
    letter-spacing: .12em;
    text-transform: uppercase;
    color: var(--accent);
    border: 1px solid rgba(255,106,61,0.35);
    border-radius: 999px;
    padding: 5px 12px;
    margin-bottom: 20px;
  }
  h1 {
    font-size: 34px;
    line-height: 1.25;
    margin: 0 0 12px;
    letter-spacing: -0.01em;
  }
  .sub {
    color: var(--muted);
    font-size: 15px;
    line-height: 1.7;
    margin: 0;
  }
  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(268px, 1fr));
    gap: 18px;
  }
  a.card {
    display: block;
    text-decoration: none;
    color: inherit;
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 16px;
    padding: 22px 22px 18px;
    transition: background .18s ease, transform .18s ease, border-color .18s ease;
  }
  a.card:hover {
    background: var(--card-hover);
    border-color: rgba(255,106,61,0.45);
    transform: translateY(-3px);
  }
  .icon {
    width: 42px; height: 42px;
    border-radius: 11px;
    display: grid;
    place-items: center;
    font-size: 18px;
    font-weight: 600;
    color: #ffb59d;
    background: rgba(255,106,61,0.13);
    border: 1px solid rgba(255,106,61,0.22);
    margin-bottom: 16px;
  }
  .name {
    font-size: 17px;
    font-weight: 600;
    margin: 0 0 8px;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .name span.arrow {
    color: var(--accent);
    font-weight: 400;
    opacity: .55;
    transition: opacity .18s ease, transform .18s ease;
  }
  a.card:hover .name span.arrow { opacity: 1; transform: translateX(3px); }
  .desc {
    color: var(--muted);
    font-size: 13.5px;
    line-height: 1.65;
    margin: 0 0 16px;
    min-height: 44px;
  }
  .tags { display: flex; flex-wrap: wrap; gap: 7px; }
  .tag {
    font-size: 11.5px;
    color: #aab2c5;
    background: rgba(255,255,255,0.05);
    border: 1px solid var(--line);
    border-radius: 6px;
    padding: 3px 8px;
    letter-spacing: .02em;
  }
  .empty {
    border: 1px dashed var(--line);
    border-radius: 16px;
    padding: 26px 22px;
    color: var(--muted);
    font-size: 13.5px;
    line-height: 1.7;
  }
  footer {
    margin-top: 56px;
    padding-top: 22px;
    border-top: 1px solid var(--line);
    color: #5f677a;
    font-size: 12.5px;
    display: flex;
    justify-content: space-between;
    gap: 12px;
    flex-wrap: wrap;
  }
  @media (max-width: 520px) {
    .wrap { padding: 48px 18px 40px; }
    h1 { font-size: 27px; }
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="badge">Index</div>
    <h1>站点入口</h1>
    <p class="sub">这里收录我放在公网上的页面，目前只有一个，之后会继续加。</p>
  </header>

  <main class="grid">
    <a class="card" href="fps/">
      <div class="icon">A</div>
      <h2 class="name">竞技场 FPS <span class="arrow">→</span></h2>
      <p class="desc">竞技场题材的第一人称射击展示页，打开即玩。</p>
      <div class="tags">
        <span class="tag">FPS</span>
        <span class="tag">单页</span>
        <span class="tag">HTML</span>
      </div>
    </a>
  </main>

  <footer>
    <span>静态托管 · GitHub Pages</span>
    <span>更多页面陆续添加中</span>
  </footer>
</div>
</body>
</html>
