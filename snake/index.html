<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#0b0d12">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'><rect width='64' height='64' rx='14' fill='%234fd08a'/><circle cx='22' cy='24' r='6' fill='%230b0d12'/><rect x='16' y='36' width='32' height='10' rx='5' fill='%230b0d12'/></svg>">
<title>贪吃蛇</title>
<style>
  :root {
    --bg: #0b0d12; --panel: #14171f; --line: rgba(255,255,255,0.08);
    --text: #e8ebf2; --muted: #8b93a7; --accent: #4fd08a; --food: #ff6a3d;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body {
    margin: 0; min-height: 100%; padding: 20px 16px 28px;
    background: var(--bg);
    background-image:
      radial-gradient(900px 520px at 10% -10%, rgba(79,208,138,0.13), transparent 60%),
      radial-gradient(760px 480px at 92% 0%, rgba(58,120,255,0.09), transparent 65%);
    background-attachment: fixed;
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
      "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    -webkit-font-smoothing: antialiased;
    display: flex; align-items: flex-start; justify-content: center;
  }
  .app { width: min(94vw, 470px); }
  .head { display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; margin-bottom: 14px; }
  h1 { font-size: 30px; margin: 0 0 6px; letter-spacing: -0.02em; line-height: 1.1; }
  .hint { color: var(--muted); font-size: 12.5px; margin: 0; }
  .scores { display: flex; gap: 8px; }
  .score-box {
    background: var(--panel); border: 1px solid var(--line); border-radius: 10px;
    padding: 7px 14px; min-width: 74px; text-align: center;
  }
  .score-box .label { display: block; font-size: 10.5px; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); margin-bottom: 2px; }
  .score-box .value { font-size: 18px; font-weight: 700; font-variant-numeric: tabular-nums; line-height: 1.15; }
  .stage {
    position: relative; width: 100%; aspect-ratio: 1 / 1;
    background: var(--panel); border: 1px solid var(--line); border-radius: 16px;
    box-shadow: 0 24px 60px -30px rgba(0,0,0,0.9); overflow: hidden; touch-action: none;
  }
  canvas { display: block; width: 100%; height: 100%; }
  .overlay {
    position: absolute; inset: 0; display: none; flex-direction: column;
    align-items: center; justify-content: center; gap: 12px;
    background: rgba(11,13,18,0.84); backdrop-filter: blur(3px); z-index: 5;
  }
  .overlay.show { display: flex; }
  .overlay .ot { font-size: 24px; font-weight: 700; margin: 0; }
  .overlay .os { color: var(--muted); font-size: 13px; margin: 0; }
  .bar { display: flex; gap: 10px; margin-top: 14px; }
  button {
    flex: 1; font: inherit; font-size: 13.5px; color: var(--text);
    background: var(--panel); border: 1px solid var(--line); border-radius: 10px;
    padding: 11px 10px; cursor: pointer; transition: background .15s, border-color .15s, transform .1s;
  }
  button:hover { background: #1a1e28; border-color: rgba(79,208,138,0.45); }
  button:active { transform: scale(.985); }
  button.primary { color: #cdfbe0; background: rgba(79,208,138,0.13); border-color: rgba(79,208,138,0.34); }
  footer { margin-top: 14px; display: flex; justify-content: space-between; color: #5f677a; font-size: 11.5px; gap: 10px; flex-wrap: wrap; }
  footer a { color: #7d879c; text-decoration: none; }
  footer a:hover { color: var(--accent); }
  @media (max-width: 380px) {
    h1 { font-size: 25px; }
    .score-box { min-width: 64px; padding: 6px 10px; }
    .score-box .value { font-size: 16px; }
  }
</style>
</head>
<body>
<div class="app">
  <div class="head">
    <div>
      <h1>贪吃蛇</h1>
      <p class="hint">方向键 / WASD 转向，空格暂停，手机直接滑</p>
    </div>
    <div class="scores">
      <div class="score-box"><span class="label">Score</span><span class="value" id="score">0</span></div>
      <div class="score-box"><span class="label">Best</span><span class="value" id="best">0</span></div>
    </div>
  </div>

  <div class="stage">
    <canvas id="cv"></canvas>
    <div class="overlay" id="overlay">
      <p class="ot" id="ovTitle">撞墙了</p>
      <p class="os" id="ovSub">本局得分 0</p>
      <button class="primary" id="ovBtn" style="flex:0 0 auto;padding:11px 22px">再来一局</button>
    </div>
  </div>

  <div class="bar">
    <button class="primary" id="restart">重新开始</button>
    <button id="pause">暂停</button>
  </div>

  <footer>
    <span>吃一颗长一节，吃得越多越快</span>
    <a href="../">返回站点入口</a>
  </footer>
</div>

<script>
(function () {
  var COLS = 20, ROWS = 20;
  var cv = document.getElementById('cv');
  var ctx = cv.getContext('2d');
  var stage = cv.parentNode;
  var scoreEl = document.getElementById('score');
  var bestEl = document.getElementById('best');
  var overlay = document.getElementById('overlay');
  var ovTitle = document.getElementById('ovTitle');
  var ovSub = document.getElementById('ovSub');

  var dpr = Math.min(2, window.devicePixelRatio || 1);
  var cell = 20;

  var snake, dir, queue, food, score, best = 0, dead, paused, tickMs, acc, lastTs, started;

  function loadBest() {
    try { best = parseInt(localStorage.getItem('snake-best') || '0', 10) || 0; } catch (e) { best = 0; }
    bestEl.textContent = best;
  }

  function layout() {
    var w = stage.clientWidth;
    cv.width = Math.round(w * dpr);
    cv.height = Math.round(w * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    cell = w / COLS;
    draw();
  }

  function reset() {
    snake = [{ x: 9, y: 10 }, { x: 8, y: 10 }, { x: 7, y: 10 }];
    dir = { x: 1, y: 0 };
    queue = [];
    score = 0;
    dead = false; paused = false; started = false;
    tickMs = 150; acc = 0; lastTs = 0;
    scoreEl.textContent = '0';
    overlay.classList.remove('show');
    placeFood();
    draw();
  }

  function placeFood() {
    var free = [];
    for (var y = 0; y < ROWS; y++) {
      for (var x = 0; x < COLS; x++) {
        var hit = false;
        for (var i = 0; i < snake.length; i++) {
          if (snake[i].x === x && snake[i].y === y) { hit = true; break; }
        }
        if (!hit) free.push({ x: x, y: y });
      }
    }
    food = free.length ? free[Math.floor(Math.random() * free.length)] : null;
  }

  function step() {
    // 取一个合法的新方向（不能直接反向）
    while (queue.length) {
      var d = queue.shift();
      if (d.x === -dir.x && d.y === -dir.y) continue;
      if (d.x === dir.x && d.y === dir.y) continue;
      dir = d;
      break;
    }
    var head = { x: snake[0].x + dir.x, y: snake[0].y + dir.y };
    if (head.x < 0 || head.y < 0 || head.x >= COLS || head.y >= ROWS) return die('撞墙了');
    for (var i = 0; i < snake.length - 1; i++) {
      if (snake[i].x === head.x && snake[i].y === head.y) return die('咬到自己了');
    }
    snake.unshift(head);
    if (food && head.x === food.x && head.y === food.y) {
      score += 10;
      scoreEl.textContent = score;
      if (score > best) { best = score; bestEl.textContent = best; try { localStorage.setItem('snake-best', String(best)); } catch (e) {} }
      tickMs = Math.max(68, 150 - snake.length * 4);
      placeFood();
      if (!food) return win();
    } else {
      snake.pop();
    }
  }

  function die(reason) {
    dead = true;
    ovTitle.textContent = reason;
    ovSub.textContent = '本局得分 ' + score + ' · 最高 ' + best;
    overlay.classList.add('show');
  }

  function win() {
    dead = true;
    ovTitle.textContent = '填满了';
    ovSub.textContent = '这盘你吃干净了，得分 ' + score;
    overlay.classList.add('show');
  }

  function draw() {
    if (!cv.width) return;
    var w = COLS * cell;
    ctx.clearRect(0, 0, w, w);
    // 网格点
    ctx.fillStyle = 'rgba(255,255,255,0.045)';
    for (var y = 0; y < ROWS; y++) {
      for (var x = 0; x < COLS; x++) {
        ctx.fillRect(x * cell + cell / 2 - 0.6, y * cell + cell / 2 - 0.6, 1.2, 1.2);
      }
    }
    // 食物
    if (food) {
      ctx.fillStyle = '#ff6a3d';
      ctx.beginPath();
      ctx.arc((food.x + 0.5) * cell, (food.y + 0.5) * cell, cell * 0.32, 0, Math.PI * 2);
      ctx.fill();
    }
    // 蛇
    for (var i = snake.length - 1; i >= 0; i--) {
      var s = snake[i];
      var p = i / Math.max(1, snake.length - 1);
      ctx.fillStyle = i === 0 ? '#8ff0bb' : 'rgba(79,208,138,' + (0.92 - p * 0.45).toFixed(3) + ')';
      var pad = cell * (i === 0 ? 0.06 : 0.1);
      roundRect(s.x * cell + pad, s.y * cell + pad, cell - pad * 2, cell - pad * 2, cell * 0.22);
    }
    // 未开始时提示
    if (!started && !dead) {
      ctx.fillStyle = 'rgba(232,235,242,0.5)';
      ctx.font = '14px -apple-system, "PingFang SC", sans-serif';
      ctx.textAlign = 'center';
      ctx.fillText('按方向键或滑动开始', w / 2, w / 2 - cell * 1.6);
    }
  }

  function roundRect(x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r);
    ctx.arcTo(x, y, x + w, y, r);
    ctx.closePath();
    ctx.fill();
  }

  function loop(ts) {
    if (!lastTs) lastTs = ts;
    var dt = ts - lastTs;
    lastTs = ts;
    if (!dead && !paused && started) {
      acc += dt;
      while (acc >= tickMs) {
        acc -= tickMs;
        step();
        if (dead) break;
      }
    }
    draw();
    requestAnimationFrame(loop);
  }

  // ---------- 输入 ----------
  var KEY = {
    ArrowLeft: { x: -1, y: 0 }, ArrowRight: { x: 1, y: 0 },
    ArrowUp: { x: 0, y: -1 }, ArrowDown: { x: 0, y: 1 },
    a: { x: -1, y: 0 }, d: { x: 1, y: 0 }, w: { x: 0, y: -1 }, s: { x: 0, y: 1 },
    A: { x: -1, y: 0 }, D: { x: 1, y: 0 }, W: { x: 0, y: -1 }, S: { x: 0, y: 1 }
  };

  function turn(d) {
    if (dead || paused) return;
    started = true;
    if (queue.length < 3) queue.push(d);
  }

  document.addEventListener('keydown', function (e) {
    if (e.key === ' ') { e.preventDefault(); togglePause(); return; }
    var d = KEY[e.key];
    if (!d) return;
    e.preventDefault();
    turn(d);
  });

  var touchStart = null;
  cv.addEventListener('pointerdown', function (e) {
    touchStart = { x: e.clientX, y: e.clientY };
    if (cv.setPointerCapture) { try { cv.setPointerCapture(e.pointerId); } catch (err) {} }
  });
  function swipeEnd(e) {
    if (!touchStart) return;
    var dx = e.clientX - touchStart.x, dy = e.clientY - touchStart.y;
    touchStart = null;
    if (Math.abs(dx) < 22 && Math.abs(dy) < 22) return;
    if (Math.abs(dx) > Math.abs(dy)) turn({ x: dx > 0 ? 1 : -1, y: 0 });
    else turn({ x: 0, y: dy > 0 ? 1 : -1 });
  }
  cv.addEventListener('pointerup', swipeEnd);
  window.addEventListener('pointerup', swipeEnd);

  function togglePause() {
    if (dead) return;
    paused = !paused;
    document.getElementById('pause').textContent = paused ? '继续' : '暂停';
  }

  document.getElementById('restart').addEventListener('click', function () {
    document.getElementById('pause').textContent = '暂停';
    reset();
  });
  document.getElementById('pause').addEventListener('click', togglePause);
  document.getElementById('ovBtn').addEventListener('click', reset);

  var rt = null;
  window.addEventListener('resize', function () {
    clearTimeout(rt);
    rt = setTimeout(layout, 120);
  });

  loadBest();
  reset();
  layout();
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
