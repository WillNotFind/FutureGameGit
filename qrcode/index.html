<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b0d12">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'><rect width='64' height='64' rx='14' fill='%23e8ebf2'/><rect x='12' y='12' width='16' height='16' fill='%230b0d12'/><rect x='36' y='12' width='16' height='16' fill='%230b0d12'/><rect x='12' y='36' width='16' height='16' fill='%230b0d12'/></svg>">
<title>二维码生成器</title>
<style>
  :root {
    --bg: #0b0d12; --panel: #14171f; --panel-2: #1a1e28; --line: rgba(255,255,255,0.08);
    --text: #e8ebf2; --muted: #8b93a7; --accent: #ff6a3d;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100%;
    padding: 28px max(16px, env(safe-area-inset-right)) max(36px, env(safe-area-inset-bottom)) max(16px, env(safe-area-inset-left));
    background: var(--bg);
    background-image:
      radial-gradient(900px 520px at 8% -10%, rgba(255,106,61,0.12), transparent 60%),
      radial-gradient(760px 480px at 94% 0%, rgba(58,120,255,0.09), transparent 65%);
    background-attachment: fixed;
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
      "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    -webkit-font-smoothing: antialiased;
    display: flex; justify-content: center;
    touch-action: manipulation;
  }
  .app { width: min(94vw, 720px); }
  .lang-tab {
    position: fixed; right: 0; top: 50%; transform: translateY(-50%);
    z-index: 40; padding: 10px 7px; background: rgba(11,13,18,0.85);
    border: 1px solid rgba(255,255,255,0.22); border-right: none; border-radius: 8px 0 0 8px;
    color: #ddd; font: 700 12px/1 -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif; letter-spacing: 1px;
    cursor: pointer; -webkit-user-select: none; user-select: none;
  }
  .lang-tab:hover { color: var(--accent); border-color: var(--accent); }
  .head { margin-bottom: 20px; }
  h1 { font-size: 28px; margin: 0 0 8px; letter-spacing: -0.02em; }
  .hint { color: var(--muted); font-size: 13px; margin: 0; line-height: 1.6; }

  .grid { display: grid; grid-template-columns: 1fr 260px; gap: 18px; align-items: start; }
  @media (max-width: 700px) { .grid { grid-template-columns: 1fr; } }

  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 16px; padding: 18px; }
  label.field { display: block; font-size: 12px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); margin-bottom: 8px; }
  textarea {
    width: 100%; min-height: 148px; resize: vertical; font: inherit; font-size: 14px; line-height: 1.6;
    color: var(--text); background: var(--panel-2); border: 1px solid var(--line);
    border-radius: 10px; padding: 12px 13px; outline: none; transition: border-color .15s;
  }
  textarea:focus { border-color: rgba(255,106,61,0.45); }
  .row { display: flex; gap: 10px; margin-top: 14px; flex-wrap: wrap; }
  .row > .f { flex: 1 1 120px; }
  select {
    width: 100%; font: inherit; font-size: 13.5px; color: var(--text);
    background: var(--panel-2); border: 1px solid var(--line); border-radius: 9px;
    padding: 9px 10px; outline: none;
  }
  .actions { display: flex; gap: 10px; margin-top: 14px; }
  button {
    flex: 1; font: inherit; font-size: 13.5px; color: var(--text);
    background: var(--panel-2); border: 1px solid var(--line); border-radius: 10px;
    padding: 11px 12px; cursor: pointer; transition: background .15s, border-color .15s, transform .1s;
  }
  button:hover { background: #232833; border-color: rgba(255,106,61,0.4); }
  button:active { transform: scale(.985); }
  button.primary { color: #ffd9cd; background: rgba(255,106,61,0.13); border-color: rgba(255,106,61,0.34); }
  button:disabled { opacity: .45; cursor: not-allowed; }

  .preview { display: flex; flex-direction: column; align-items: center; gap: 12px; }
  .qr-box {
    width: 100%; aspect-ratio: 1 / 1; background: #ffffff; border-radius: 14px;
    display: grid; place-items: center; padding: 10px; overflow: hidden;
  }
  canvas#qr { width: 100%; height: auto; image-rendering: pixelated; border-radius: 6px; }
  .meta { color: var(--muted); font-size: 12px; text-align: center; line-height: 1.6; }
  .err { color: #ff8f6b; font-size: 12.5px; margin: 10px 0 0; min-height: 18px; }
  footer { margin-top: 22px; display: flex; justify-content: space-between; color: #5f677a; font-size: 11.5px; gap: 10px; flex-wrap: wrap; }
  footer a { color: #7d879c; text-decoration: none; }
  footer a:hover { color: var(--accent); }
</style>
</head>
<body>
<button class="lang-tab" id="lang-tab" type="button">EN</button>
<div class="app">
  <div class="head">
    <h1 data-i18n="title">二维码生成器</h1>
    <p class="hint" data-i18n="hint">纯前端生成，内容不会上传到任何服务器。支持中文与链接。</p>
  </div>

  <div class="grid">
    <div class="card">
      <label class="field" for="text" data-i18n="contentLabel">内容</label>
      <textarea id="text" data-i18n-placeholder="phContent" placeholder="输入网址或任意文字，例如 https://willnotfind.github.io/FutureGameGit/">https://willnotfind.github.io/FutureGameGit/</textarea>

      <div class="row">
        <div class="f">
          <label class="field" for="ecc" data-i18n="eccLabel">纠错等级</label>
          <select id="ecc">
            <option value="L">L · 7%</option>
            <option value="M" selected>M · 15%</option>
            <option value="Q">Q · 25%</option>
            <option value="H">H · 30%</option>
          </select>
        </div>
        <div class="f">
          <label class="field" for="size" data-i18n="sizeLabel">导出尺寸</label>
          <select id="size">
            <option value="256">256 px</option>
            <option value="512" selected>512 px</option>
            <option value="1024">1024 px</option>
          </select>
        </div>
      </div>

      <div class="actions">
        <button class="primary" id="download" data-i18n="download">下载 PNG</button>
        <button id="clear" data-i18n="clear">清空</button>
      </div>
      <p class="err" id="err"></p>
    </div>

    <div class="card preview">
      <div class="qr-box"><canvas id="qr"></canvas></div>
      <div class="meta" id="meta">等待输入…</div>
    </div>
  </div>

  <footer>
    <span data-i18n="footer">离线可用 · 编码库 qrcode-generator（MIT，Kazuhiko Arase）</span>
    <a href="../" data-i18n="back">返回站点入口</a>
  </footer>
</div>

<script>
// ---------- 自适应语言 ----------
var SITE_I18N = {
  zh: {
    title: '二维码生成器',
    hint: '纯前端生成，内容不会上传到任何服务器。支持中文与链接。',
    contentLabel: '内容', phContent: '输入网址或任意文字，例如 https://willnotfind.github.io/FutureGameGit/',
    eccLabel: '纠错等级', sizeLabel: '导出尺寸',
    download: '下载 PNG', clear: '清空',
    waitInput: '等待输入…',
    cannot: '无法生成',
    tooLong: '内容过长，或包含无法编码的字符。可降低纠错等级，或缩短内容。',
    exportFail: '导出失败，试试换个浏览器。',
    meta: '{n} × {n} 模块 · 纠错 {e} · {px} px（每格 {s} px）',
    footer: '离线可用 · 编码库 qrcode-generator（MIT，Kazuhiko Arase）', back: '返回站点入口'
  },
  en: {
    title: 'QR Code Generator',
    hint: 'Everything runs in your browser — nothing is uploaded. Chinese text and links are supported.',
    contentLabel: 'Content', phContent: 'Enter a URL or any text, e.g. https://willnotfind.github.io/FutureGameGit/',
    eccLabel: 'Error correction', sizeLabel: 'Export size',
    download: 'DOWNLOAD PNG', clear: 'CLEAR',
    waitInput: 'Waiting for input…',
    cannot: 'Cannot generate',
    tooLong: 'Content is too long or contains characters that cannot be encoded. Lower the error correction level or shorten the content.',
    exportFail: 'Export failed — try another browser.',
    meta: '{n} × {n} modules · ECC {e} · {px} px ({s} px per module)',
    footer: 'Works offline · library qrcode-generator (MIT, Kazuhiko Arase)', back: 'Site index'
  }
};
var SITE_LANG = '';
try { SITE_LANG = localStorage.getItem('site-lang') || ''; } catch (e) {}
if (SITE_LANG !== 'zh' && SITE_LANG !== 'en') {
  SITE_LANG = (navigator.language || navigator.userLanguage || 'en').toLowerCase().indexOf('zh') === 0 ? 'zh' : 'en';
}
function L(key, vars) {
  var d = SITE_I18N[SITE_LANG] || SITE_I18N.zh;
  var s = d[key] || SITE_I18N.zh[key] || key;
  if (!vars) return s;
  return s.replace(/\{(\w+)\}/g, function (m, k) { return vars[k] !== undefined ? vars[k] : m; });
}
function applySiteLang() {
  document.documentElement.lang = SITE_LANG === 'zh' ? 'zh-CN' : 'en';
  var nodes = document.querySelectorAll('[data-i18n]');
  for (var i = 0; i < nodes.length; i++) {
    var k = nodes[i].getAttribute('data-i18n');
    var txt = L(k);
    if (txt) nodes[i].textContent = txt;
  }
  var phs = document.querySelectorAll('[data-i18n-placeholder]');
  for (var j = 0; j < phs.length; j++) {
    phs[j].setAttribute('placeholder', L(phs[j].getAttribute('data-i18n-placeholder')));
  }
  document.getElementById('lang-tab').textContent = SITE_LANG === 'zh' ? 'EN' : '中文';
  document.title = L('title');
  try { window.dispatchEvent(new Event('langchange')); } catch (e) {}
}
document.getElementById('lang-tab').addEventListener('click', function () {
  SITE_LANG = SITE_LANG === 'zh' ? 'en' : 'zh';
  try { localStorage.setItem('site-lang', SITE_LANG); } catch (e) {}
  applySiteLang();
});
applySiteLang();
</script>
<script src="qrcode.js"></script>
<script>
(function () {
  var ta = document.getElementById('text');
  var eccSel = document.getElementById('ecc');
  var sizeSel = document.getElementById('size');
  var cv = document.getElementById('qr');
  var ctx = cv.getContext('2d');
  var meta = document.getElementById('meta');
  var errEl = document.getElementById('err');
  var dlBtn = document.getElementById('download');

  var lastOk = false;
  var timer = null;

  function render() {
    var text = ta.value;
    errEl.textContent = '';
    if (!text) {
      cv.width = 0; cv.height = 0;
      meta.textContent = L('waitInput');
      lastOk = false;
      dlBtn.disabled = true;
      return;
    }
    var qr;
    try {
      qr = qrcode(0, eccSel.value);
      qr.addData(text);
      qr.make();
      var px = parseInt(sizeSel.value, 10);
      var margin = 4; // 静区，单位：模块
      var count = qr.getModuleCount();
      var total = count + margin * 2;
      // 模块用整数像素绘制保证锐利，整张画布固定为所选尺寸，余量居中留白
      var scale = Math.max(1, Math.floor(px / total));
      var side = scale * total;
      var off = Math.max(0, Math.floor((px - side) / 2));
      cv.width = px; cv.height = px;
      cv.style.width = '100%';
      ctx.fillStyle = '#ffffff';
      ctx.fillRect(0, 0, px, px);
      ctx.fillStyle = '#0b0d12';
      for (var r = 0; r < count; r++) {
        for (var c = 0; c < count; c++) {
          if (qr.isDark(r, c)) {
            ctx.fillRect(off + (c + margin) * scale, off + (r + margin) * scale, scale, scale);
          }
        }
      }
      meta.textContent = L('meta', { n: count, e: eccSel.value, px: px, s: scale });
      lastOk = true;
      dlBtn.disabled = false;
    } catch (e) {
      cv.width = 0; cv.height = 0;
      meta.textContent = L('cannot');
      errEl.textContent = L('tooLong');
      lastOk = false;
      dlBtn.disabled = true;
    }
  }

  function schedule() {
    clearTimeout(timer);
    timer = setTimeout(render, 220);
  }

  ta.addEventListener('input', schedule);
  eccSel.addEventListener('change', render);
  sizeSel.addEventListener('change', render);
  document.getElementById('clear').addEventListener('click', function () {
    ta.value = '';
    ta.focus();
    render();
  });

  dlBtn.addEventListener('click', function () {
    if (!lastOk) return;
    var text = ta.value.trim().slice(0, 24).replace(/[\\/:*?"<>|\s]+/g, '_') || 'qrcode';
    cv.toBlob(function (blob) {
      if (!blob) { errEl.textContent = L('exportFail'); return; }
      var a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = text + '.png';
      document.body.appendChild(a);
      a.click();
      setTimeout(function () {
        URL.revokeObjectURL(a.href);
        document.body.removeChild(a);
      }, 1000);
    }, 'image/png');
  });

  window.addEventListener('langchange', function () { render(); });

  render();
})();
</script>
</body>
</html>
