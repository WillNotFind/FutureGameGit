<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='12' fill='%231a1a2e'/%3E%3Ccircle cx='32' cy='32' r='14' fill='none' stroke='%23ff3b3b' stroke-width='3'/%3E%3Cline x1='32' y1='10' x2='32' y2='22' stroke='%23ff3b3b' stroke-width='3'/%3E%3Cline x1='32' y1='42' x2='32' y2='54' stroke='%23ff3b3b' stroke-width='3'/%3E%3Cline x1='10' y1='32' x2='22' y2='32' stroke='%23ff3b3b' stroke-width='3'/%3E%3Cline x1='42' y1='32' x2='54' y2='32' stroke='%23ff3b3b' stroke-width='3'/%3E%3Ccircle cx='32' cy='32' r='3' fill='%23ff3b3b'/%3E%3C/svg%3E">
<title>竞技场 FPS</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #0a0a0f; font-family: 'Segoe UI', 'Microsoft YaHei', sans-serif; color: #e8e8e8; user-select: none; }
  #game-canvas { display: block; width: 100%; height: 100%; cursor: none; }

  /* ===== 准星 ===== */
  #crosshair {
    position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%);
    width: 24px; height: 24px; pointer-events: none; z-index: 10; transition: width 0.15s, height 0.15s;
  }
  #crosshair::before, #crosshair::after {
    content: ''; position: absolute; background: rgba(255,255,255,0.85);
  }
  #crosshair::before { top: 50%; left: 0; width: 100%; height: 2px; transform: translateY(-50%); }
  #crosshair::after { left: 50%; top: 0; width: 2px; height: 100%; transform: translateX(-50%); }
  #crosshair .dot { position: absolute; top: 50%; left: 50%; width: 4px; height: 4px; background: #ff4444; border-radius: 50%; transform: translate(-50%,-50%); }
  body.ads #crosshair { width: 12px; height: 12px; }
  body.ads #crosshair::before, body.ads #crosshair::after { background: rgba(255,80,80,0.9); }

  /* 狙击瞄准镜 */
  #sniper-scope {
    position: fixed; inset: 0; pointer-events: none; z-index: 9; display: none;
    background: radial-gradient(circle at center, transparent 0%, transparent 28%, rgba(0,0,0,0.97) 32%, rgba(0,0,0,0.97) 100%);
  }
  #sniper-scope::before, #sniper-scope::after {
    content:''; position:absolute; background: rgba(0,0,0,0.8);
  }
  #sniper-scope::before { top:50%; left:0; width:100%; height:1px; }
  #sniper-scope::after { left:50%; top:0; width:1px; height:100%; }
  body.ads.sniper #crosshair { display: none; }
  body.ads.sniper #sniper-scope { display: block; }

  /* ===== HUD ===== */
  #hud { position: fixed; inset: 0; pointer-events: none; z-index: 5; display: none; }
  .hud-panel {
    position: absolute; background: rgba(10,10,20,0.55); backdrop-filter: blur(6px);
    border: 1px solid rgba(255,255,255,0.12); border-radius: 8px; padding: 10px 16px;
  }
  #hud-health { bottom: 24px; left: 24px; min-width: 200px; }
  #hud-ammo { bottom: 24px; right: 24px; text-align: right; min-width: 180px; }
  #hud-score { top: 20px; left: 24px; text-align: center; }
  #hud-wave { top: 20px; left: 50%; transform: translateX(-50%); text-align: center; }
  #hud-weapon { bottom: 100px; right: 24px; text-align: right; min-width: 160px; }
  #hud-grenade { bottom: 100px; left: 24px; min-width: 140px; }
  .hud-label { font-size: 11px; letter-spacing: 2px; color: #888; text-transform: uppercase; margin-bottom: 4px; }
  .hud-value { font-size: 28px; font-weight: 700; line-height: 1; }
  .hud-value.small { font-size: 20px; }
  #health-bar-wrap { width: 100%; height: 8px; background: rgba(255,255,255,0.1); border-radius: 4px; margin-top: 8px; overflow: hidden; }
  #health-bar { height: 100%; width: 100%; background: linear-gradient(90deg, #ff3b3b, #ff8c3b); transition: width 0.2s; }
  #shield-bar-wrap { width: 100%; height: 5px; background: rgba(255,255,255,0.1); border-radius: 3px; margin-top: 4px; overflow: hidden; display: none; }
  #shield-bar { height: 100%; width: 100%; background: linear-gradient(90deg, #3b8bff, #3bd4ff); transition: width 0.2s; }
  #damage-overlay {
    position: fixed; inset: 0; pointer-events: none; z-index: 6;
    box-shadow: inset 0 0 120px rgba(255,0,0,0); transition: box-shadow 0.3s;
  }
  /* Buff 指示器 */
  #buffs { position: fixed; top: 80px; left: 24px; display: flex; flex-direction: column; gap: 6px; z-index: 5; }
  .buff-tag {
    background: rgba(10,10,20,0.6); border: 1px solid rgba(255,255,255,0.15); border-radius: 6px;
    padding: 4px 12px; font-size: 12px; font-weight: 600; display: flex; align-items: center; gap: 8px;
  }
  .buff-tag .buff-icon { width: 8px; height: 8px; border-radius: 50%; }
  .buff-tag.speed { border-color: #ffcc33; color: #ffcc33; }
  .buff-tag.speed .buff-icon { background: #ffcc33; }
  .buff-tag.shield { border-color: #33aaff; color: #33aaff; }
  .buff-tag.shield .buff-icon { background: #33aaff; }

  /* 武器切换提示 */
  #weapon-slots { position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%); display: flex; gap: 8px; z-index: 5; }
  .weapon-slot {
    width: 52px; height: 52px; background: rgba(10,10,20,0.55); border: 1px solid rgba(255,255,255,0.15);
    border-radius: 8px; display: flex; flex-direction: column; align-items: center; justify-content: center;
    font-size: 10px; color: #888; transition: all 0.15s;
  }
  .weapon-slot.active { border-color: #ff6b35; background: rgba(255,107,53,0.15); color: #ff6b35; }
  .weapon-slot .key { font-size: 14px; font-weight: 700; }
  .weapon-slot .wname { font-size: 9px; margin-top: 2px; }

  /* ===== 小地图 ===== */
  #minimap-wrap {
    position: fixed; top: 20px; right: 24px; z-index: 5;
    background: rgba(10,10,20,0.6); border: 1px solid rgba(255,255,255,0.15); border-radius: 8px; padding: 6px;
  }
  #minimap { display: block; border-radius: 4px; }

  /* ===== 开始 / 结束界面 ===== */
  .overlay {
    position: fixed; inset: 0; z-index: 20; display: flex; flex-direction: column;
    align-items: center; justify-content: center; background: radial-gradient(ellipse at center, rgba(20,20,40,0.92), rgba(5,5,10,0.98));
    cursor: default;
  }
  .overlay h1 { font-size: 64px; font-weight: 900; letter-spacing: 8px; margin-bottom: 8px;
    background: linear-gradient(135deg, #ff6b35, #ff3b3b, #ff6b35); -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent; }
  .overlay .subtitle { font-size: 16px; color: #888; letter-spacing: 4px; margin-bottom: 40px; }
  .overlay .stats { display: flex; gap: 48px; margin-bottom: 36px; }
  .overlay .stat-item { text-align: center; }
  .overlay .stat-num { font-size: 42px; font-weight: 700; color: #ff6b35; }
  .overlay .stat-label { font-size: 12px; color: #888; letter-spacing: 2px; margin-top: 4px; }
  .btn-start {
    padding: 16px 56px; font-size: 18px; font-weight: 700; letter-spacing: 4px; color: #fff;
    background: linear-gradient(135deg, #ff6b35, #ff3b3b); border: none; border-radius: 8px;
    cursor: pointer; transition: transform 0.15s, box-shadow 0.15s; box-shadow: 0 4px 24px rgba(255,59,59,0.4);
  }
  .btn-start:hover { transform: translateY(-2px); box-shadow: 0 8px 32px rgba(255,59,59,0.6); }
  .btn-start:active { transform: translateY(0); }
  .controls-info { margin-top: 36px; display: grid; grid-template-columns: auto auto; gap: 8px 24px; font-size: 13px; color: #999; }
  .controls-info .key { display: inline-block; min-width: 28px; padding: 2px 8px; background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.2); border-radius: 4px; text-align: center; font-weight: 600; color: #ddd; margin-right: 8px; }
  #game-over { display: none; }
  #hit-marker {
    position: fixed; top: 50%; left: 50%; transform: translate(-50%,-50%) rotate(45deg);
    width: 20px; height: 20px; pointer-events: none; z-index: 11; opacity: 0;
  }
  #hit-marker::before, #hit-marker::after { content:''; position:absolute; background:#fff; }
  #hit-marker::before { top:50%; left:0; width:100%; height:2px; transform:translateY(-50%); }
  #hit-marker::after { left:50%; top:0; width:2px; height:100%; transform:translateX(-50%); }
  #muzzle-flash {
    position: fixed; bottom: 100px; right: 130px; width: 90px; height: 90px;
    background: radial-gradient(circle, rgba(255,200,50,0.9), rgba(255,100,0,0.4), transparent 70%);
    border-radius: 50%; pointer-events: none; z-index: 8; opacity: 0; transition: opacity 0.05s;
  }
  body.ads #muzzle-flash { bottom: 140px; right: 50%; transform: translateX(50%); }

  /* 武器视图容器 */
  #weapon-view {
    position: fixed; bottom: -30px; right: 30px; width: 320px; height: 240px;
    pointer-events: none; z-index: 7; transition: all 0.18s ease-out;
  }
  body.ads #weapon-view {
    bottom: -10px; right: 50%; transform: translateX(50%) scale(0.85);
    width: 260px; height: 200px;
  }
  #weapon-view svg { width: 100%; height: 100%; }

  /* 换弹提示 */
  #reload-indicator {
    position: fixed; bottom: 180px; right: 24px; font-size: 13px; color: #ffcc33;
    letter-spacing: 2px; z-index: 5; display: none;
  }
  /* 拾取提示 */
  #pickup-toast {
    position: fixed; top: 40%; left: 50%; transform: translateX(-50%);
    background: rgba(10,10,20,0.8); border: 1px solid rgba(255,255,255,0.2); border-radius: 8px;
    padding: 10px 24px; font-size: 16px; font-weight: 600; z-index: 12; opacity: 0;
    transition: opacity 0.3s; pointer-events: none;
  }
</style>
</head>
<body>

<canvas id="game-canvas"></canvas>

<!-- 准星 -->
<div id="crosshair"><div class="dot"></div></div>
<div id="sniper-scope"></div>
<div id="hit-marker"></div>
<div id="muzzle-flash"></div>
<div id="pickup-toast"></div>

<!-- 武器视图 -->
<div id="weapon-view"></div>

<!-- HUD -->
<div id="hud">
  <div class="hud-panel" id="hud-health">
    <div class="hud-label">生命值</div>
    <div class="hud-value" id="health-text">100</div>
    <div id="health-bar-wrap"><div id="health-bar"></div></div>
    <div id="shield-bar-wrap"><div id="shield-bar"></div></div>
  </div>
  <div class="hud-panel" id="hud-ammo">
    <div class="hud-label">弹药</div>
    <div class="hud-value"><span id="ammo-current">30</span> <span style="font-size:16px;color:#888">/ <span id="ammo-reserve">∞</span></span></div>
  </div>
  <div class="hud-panel" id="hud-weapon">
    <div class="hud-label">当前武器</div>
    <div class="hud-value small" id="weapon-name">突击步枪</div>
  </div>
  <div class="hud-panel" id="hud-grenade">
    <div class="hud-label">手雷 [G]</div>
    <div class="hud-value small">∞</div>
  </div>
  <div class="hud-panel" id="hud-score">
    <div class="hud-label">击杀</div>
    <div class="hud-value small" id="score-text">0</div>
  </div>
  <div class="hud-panel" id="hud-wave">
    <div class="hud-label">波次</div>
    <div class="hud-value small" id="wave-text">1</div>
  </div>
  <div id="buffs"></div>
  <div id="weapon-slots">
    <div class="weapon-slot active" data-w="rifle"><span class="key">1</span><span class="wname">步枪</span></div>
    <div class="weapon-slot" data-w="pistol"><span class="key">2</span><span class="wname">手枪</span></div>
    <div class="weapon-slot" data-w="shotgun"><span class="key">3</span><span class="wname">霰弹</span></div>
    <div class="weapon-slot" data-w="sniper"><span class="key">4</span><span class="wname">狙击</span></div>
  </div>
  <div id="reload-indicator">换弹中...</div>
</div>

<!-- 小地图 -->
<div id="minimap-wrap">
  <canvas id="minimap" width="160" height="160"></canvas>
</div>

<div id="damage-overlay"></div>

<!-- 开始界面 -->
<div class="overlay" id="start-screen">
  <h1>竞技场 FPS</h1>
  <div class="subtitle">ARENA · FIRST PERSON SHOOTER</div>
  <button class="btn-start" id="btn-start" onclick="startGame()">开始游戏</button>
  <div class="controls-info">
    <div><span class="key">W A S D</span>移动</div>
    <div><span class="key">鼠标</span>视角</div>
    <div><span class="key">左键</span>射击</div>
    <div><span class="key">右键</span>瞄准</div>
    <div><span class="key">R</span>换弹</div>
    <div><span class="key">G</span>手雷</div>
    <div><span class="key">1-4</span>切换武器</div>
    <div><span class="key">空格</span>跳跃</div>
    <div><span class="key">Shift</span>冲刺</div>
    <div><span class="key">滚轮</span>切换武器</div>
  </div>
</div>

<!-- 结束界面 -->
<div class="overlay" id="game-over">
  <h1 style="font-size:48px">任务失败</h1>
  <div class="subtitle">GAME OVER</div>
  <div class="stats">
    <div class="stat-item"><div class="stat-num" id="final-kills">0</div><div class="stat-label">击杀数</div></div>
    <div class="stat-item"><div class="stat-num" id="final-wave">1</div><div class="stat-label">到达波次</div></div>
    <div class="stat-item"><div class="stat-num" id="final-accuracy">0%</div><div class="stat-label">命中率</div></div>
  </div>
  <button class="btn-start" id="btn-restart" onclick="startGame()">再来一局</button>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/0.160.0/three.min.js"></script>
<script>
// ============================================================
//  竞技场 FPS v2 — 多武器 / 手雷 / 道具 / 小地图 / 瞄准
// ============================================================

// ---------- 武器定义 ----------
const WEAPONS = {
  rifle:   { name: '突击步枪', damage: 25,  fireRate: 120, magSize: 30, reloadTime: 1200, auto: true,  spread: 0.020, pellets: 1, zoomFov: 50 },
  pistol:  { name: '手枪',     damage: 45,  fireRate: 280, magSize: 12, reloadTime: 900,  auto: false, spread: 0.010, pellets: 1, zoomFov: 55 },
  shotgun: { name: '霰弹枪',   damage: 14,  fireRate: 750, magSize: 6,  reloadTime: 1700, auto: false, spread: 0.090, pellets: 8, zoomFov: 60 },
  sniper:  { name: '狙击枪',   damage: 130, fireRate: 1100,magSize: 5,  reloadTime: 2000, auto: false, spread: 0.001, pellets: 1, zoomFov: 18 },
};
const WEAPON_ORDER = ['rifle', 'pistol', 'shotgun', 'sniper'];

// ---------- 武器 SVG 视图 ----------
const WEAPON_SVGS = {
  rifle: `<svg viewBox="0 0 320 240" width="320" height="240">
    <rect x="70" y="110" width="180" height="40" rx="5" fill="#2a2a35" stroke="#444" stroke-width="1"/>
    <rect x="230" y="118" width="70" height="16" rx="2" fill="#1a1a22"/>
    <rect x="290" y="112" width="16" height="28" rx="2" fill="#111"/>
    <rect x="115" y="145" width="32" height="58" rx="3" fill="#33333f" transform="rotate(-8 131 145)"/>
    <rect x="80" y="145" width="30" height="64" rx="4" fill="#252530" transform="rotate(12 95 145)"/>
    <rect x="140" y="92" width="60" height="22" rx="4" fill="#1e1e28"/>
    <circle cx="170" cy="103" r="8" fill="#0a0a12" stroke="#555" stroke-width="1"/>
    <path d="M 105 152 Q 105 178 122 178 L 127 152" fill="none" stroke="#333" stroke-width="4"/>
    <line x1="80" y1="122" x2="240" y2="122" stroke="#444" stroke-width="0.5"/>
    <rect x="195" y="116" width="24" height="7" rx="1" fill="#3a3a48"/>
    <rect x="70" y="105" width="20" height="10" rx="2" fill="#333"/>
  </svg>`,
  pistol: `<svg viewBox="0 0 320 240" width="320" height="240">
    <rect x="100" y="100" width="130" height="36" rx="5" fill="#2a2a35" stroke="#444" stroke-width="1"/>
    <rect x="210" y="106" width="50" height="14" rx="2" fill="#1a1a22"/>
    <rect x="252" y="102" width="14" height="22" rx="2" fill="#111"/>
    <rect x="115" y="132" width="34" height="70" rx="5" fill="#252530" transform="rotate(8 132 132)"/>
    <rect x="140" y="130" width="22" height="40" rx="3" fill="#33333f"/>
    <circle cx="130" cy="118" r="5" fill="#0a0a12" stroke="#555" stroke-width="1"/>
    <path d="M 148 136 Q 148 158 162 158 L 166 136" fill="none" stroke="#333" stroke-width="3"/>
    <line x1="105" y1="112" x2="210" y2="112" stroke="#444" stroke-width="0.5"/>
  </svg>`,
  shotgun: `<svg viewBox="0 0 320 240" width="320" height="240">
    <rect x="60" y="108" width="200" height="30" rx="4" fill="#3a2a1a" stroke="#554" stroke-width="1"/>
    <rect x="230" y="104" width="70" height="18" rx="2" fill="#1a1a22"/>
    <rect x="290" y="100" width="18" height="26" rx="2" fill="#111"/>
    <rect x="230" y="122" width="70" height="14" rx="2" fill="#2a2a22"/>
    <rect x="80" y="135" width="30" height="62" rx="5" fill="#2a1a0a" transform="rotate(10 95 135)"/>
    <rect x="130" y="135" width="36" height="50" rx="3" fill="#33333f" transform="rotate(-6 148 135)"/>
    <path d="M 112 140 Q 112 165 128 165 L 133 140" fill="none" stroke="#443" stroke-width="4"/>
    <line x1="65" y1="118" x2="230" y2="118" stroke="#554" stroke-width="0.5"/>
    <circle cx="295" cy="113" r="4" fill="#0a0a12"/>
  </svg>`,
  sniper: `<svg viewBox="0 0 320 240" width="320" height="240">
    <rect x="50" y="112" width="190" height="32" rx="4" fill="#1f2a1f" stroke="#345" stroke-width="1"/>
    <rect x="220" y="116" width="80" height="12" rx="2" fill="#111"/>
    <rect x="290" y="112" width="18" height="20" rx="2" fill="#0a0a0a"/>
    <rect x="90" y="80" width="110" height="28" rx="6" fill="#111" stroke="#333" stroke-width="1"/>
    <circle cx="115" cy="94" r="10" fill="#0a0a12" stroke="#555" stroke-width="1.5"/>
    <circle cx="175" cy="94" r="10" fill="#0a0a12" stroke="#555" stroke-width="1.5"/>
    <rect x="100" y="140" width="30" height="58" rx="3" fill="#2a2a2a" transform="rotate(-8 115 140)"/>
    <rect x="60" y="140" width="32" height="60" rx="4" fill="#1a2a1a" transform="rotate(12 76 140)"/>
    <path d="M 88 146 Q 88 170 104 170 L 109 146" fill="none" stroke="#333" stroke-width="4"/>
    <rect x="200" y="138" width="20" height="14" rx="2" fill="#222"/>
    <line x1="55" y1="124" x2="220" y2="124" stroke="#345" stroke-width="0.5"/>
  </svg>`,
};

// ---------- 全局状态 ----------
const STATE = {
  playing: false,
  health: 100,
  maxHealth: 100,
  shield: 0,
  maxShield: 50,
  ammo: { rifle: 30, pistol: 12, shotgun: 6, sniper: 5 },
  currentWeapon: 'rifle',
  score: 0,
  wave: 1,
  shotsFired: 0,
  shotsHit: 0,
  reloading: false,
  enemies: [],
  grenades: [],
  pickups: [],
  lastShot: 0,
  lastGrenade: 0,
  aiming: false,
  buffs: { speed: 0, shield: 0 },
};

// ---------- Three.js 基础 ----------
const canvas = document.getElementById('game-canvas');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x1a1a2e);
scene.fog = new THREE.Fog(0x1a1a2e, 30, 90);

const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 200);
camera.position.set(0, 1.7, 0);
const baseFov = 75;

// ---------- 光照 ----------
scene.add(new THREE.AmbientLight(0x6677aa, 0.5));
const dirLight = new THREE.DirectionalLight(0xffeedd, 1.0);
dirLight.position.set(20, 40, 15);
dirLight.castShadow = true;
dirLight.shadow.mapSize.set(2048, 2048);
dirLight.shadow.camera.left = -50; dirLight.shadow.camera.right = 50;
dirLight.shadow.camera.top = 50; dirLight.shadow.camera.bottom = -50;
scene.add(dirLight);
const pl1 = new THREE.PointLight(0xff6633, 1, 25); pl1.position.set(-15, 6, -15); scene.add(pl1);
const pl2 = new THREE.PointLight(0x3366ff, 1, 25); pl2.position.set(15, 6, 15); scene.add(pl2);

// ---------- 地面 ----------
const ground = new THREE.Mesh(
  new THREE.PlaneGeometry(100, 100, 50, 50),
  new THREE.MeshStandardMaterial({ color: 0x2a2a3a, roughness: 0.9, metalness: 0.1 })
);
ground.rotation.x = -Math.PI / 2;
ground.receiveShadow = true;
scene.add(ground);
const gridHelper = new THREE.GridHelper(100, 50, 0x444466, 0x333344);
gridHelper.position.y = 0.01;
scene.add(gridHelper);

// ---------- 障碍物 ----------
const obstacles = [];
const obMat = new THREE.MeshStandardMaterial({ color: 0x3a3a50, roughness: 0.7, metalness: 0.3 });
const obMat2 = new THREE.MeshStandardMaterial({ color: 0x4a3a5a, roughness: 0.6, metalness: 0.4 });

// ---------- 碰撞 ----------
function collidesAt(x, z, r) {
  r = r || player.radius;
  for (const ob of obstacles) {
    if (x + r > ob.minX && x - r < ob.maxX && z + r > ob.minZ && z - r < ob.maxZ) return true;
  }
  if (x < -48 || x > 48 || z < -48 || z > 48) return true;
  return false;
}

// ---------- 音效 ----------
let audioCtx = null;
function initAudio() { if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)(); }
function playShot(weapon) {
  if (!audioCtx) return;
  const t = audioCtx.currentTime;
  const bufSize = audioCtx.sampleRate * 0.12;
  const buf = audioCtx.createBuffer(1, bufSize, audioCtx.sampleRate);
  const data = buf.getChannelData(0);
  for (let i = 0; i < bufSize; i++) data[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / bufSize, 2);
  const src = audioCtx.createBufferSource(); src.buffer = buf;
  const filter = audioCtx.createBiquadFilter(); filter.type = 'lowpass';
  filter.frequency.value = weapon === 'sniper' ? 3000 : weapon === 'shotgun' ? 1500 : 2000;
  const gain = audioCtx.createGain();
  gain.gain.setValueAtTime(weapon === 'sniper' ? 0.5 : 0.35, t);
  gain.gain.exponentialRampToValueAtTime(0.001, t + 0.12);
  src.connect(filter); filter.connect(gain); gain.connect(audioCtx.destination); src.start(t);
  const osc = audioCtx.createOscillator(); osc.type = 'square';
  osc.frequency.setValueAtTime(weapon === 'sniper' ? 200 : 150, t);
  osc.frequency.exponentialRampToValueAtTime(40, t + 0.1);
  const g2 = audioCtx.createGain(); g2.gain.setValueAtTime(0.3, t);
  g2.gain.exponentialRampToValueAtTime(0.001, t + 0.12);
  osc.connect(g2); g2.connect(audioCtx.destination); osc.start(t); osc.stop(t + 0.12);
}
function playHit() {
  if (!audioCtx) return; const t = audioCtx.currentTime;
  const osc = audioCtx.createOscillator(); osc.type = 'sine';
  osc.frequency.setValueAtTime(800, t); osc.frequency.exponentialRampToValueAtTime(200, t + 0.1);
  const g = audioCtx.createGain(); g.gain.setValueAtTime(0.2, t);
  g.gain.exponentialRampToValueAtTime(0.001, t + 0.12);
  osc.connect(g); g.connect(audioCtx.destination); osc.start(t); osc.stop(t + 0.12);
}
function playReload() {
  if (!audioCtx) return; const t = audioCtx.currentTime;
  [0, 0.3].forEach((delay, i) => {
    const osc = audioCtx.createOscillator(); osc.type = 'square';
    osc.frequency.value = i === 0 ? 300 : 500;
    const g = audioCtx.createGain(); g.gain.setValueAtTime(0.15, t + delay);
    g.gain.exponentialRampToValueAtTime(0.001, t + delay + 0.08);
    osc.connect(g); g.connect(audioCtx.destination); osc.start(t + delay); osc.stop(t + delay + 0.08);
  });
}
function playHurt() {
  if (!audioCtx) return; const t = audioCtx.currentTime;
  const osc = audioCtx.createOscillator(); osc.type = 'sawtooth';
  osc.frequency.setValueAtTime(200, t); osc.frequency.exponentialRampToValueAtTime(80, t + 0.2);
  const g = audioCtx.createGain(); g.gain.setValueAtTime(0.25, t);
  g.gain.exponentialRampToValueAtTime(0.001, t + 0.25);
  osc.connect(g); g.connect(audioCtx.destination); osc.start(t); osc.stop(t + 0.25);
}
function playEnemyDie() {
  if (!audioCtx) return; const t = audioCtx.currentTime;
  const osc = audioCtx.createOscillator(); osc.type = 'sawtooth';
  osc.frequency.setValueAtTime(400, t); osc.frequency.exponentialRampToValueAtTime(50, t + 0.3);
  const g = audioCtx.createGain(); g.gain.setValueAtTime(0.2, t);
  g.gain.exponentialRampToValueAtTime(0.001, t + 0.35);
  osc.connect(g); g.connect(audioCtx.destination); osc.start(t); osc.stop(t + 0.35);
}
function playExplosion() {
  if (!audioCtx) return; const t = audioCtx.currentTime;
  const bufSize = audioCtx.sampleRate * 0.5;
  const buf = audioCtx.createBuffer(1, bufSize, audioCtx.sampleRate);
  const data = buf.getChannelData(0);
  for (let i = 0; i < bufSize; i++) data[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / bufSize, 1.5);
  const src = audioCtx.createBufferSource(); src.buffer = buf;
  const filter = audioCtx.createBiquadFilter(); filter.type = 'lowpass'; filter.frequency.value = 800;
  const gain = audioCtx.createGain(); gain.gain.setValueAtTime(0.6, t);
  gain.gain.exponentialRampToValueAtTime(0.001, t + 0.5);
  src.connect(filter); filter.connect(gain); gain.connect(audioCtx.destination); src.start(t);
  const osc = audioCtx.createOscillator(); osc.type = 'sine';
  osc.frequency.setValueAtTime(80, t); osc.frequency.exponentialRampToValueAtTime(20, t + 0.4);
  const g2 = audioCtx.createGain(); g2.gain.setValueAtTime(0.5, t);
  g2.gain.exponentialRampToValueAtTime(0.001, t + 0.45);
  osc.connect(g2); g2.connect(audioCtx.destination); osc.start(t); osc.stop(t + 0.45);
}
function playPickup() {
  if (!audioCtx) return; const t = audioCtx.currentTime;
  [523, 659, 784].forEach((freq, i) => {
    const osc = audioCtx.createOscillator(); osc.type = 'sine'; osc.frequency.value = freq;
    const g = audioCtx.createGain(); g.gain.setValueAtTime(0.15, t + i * 0.08);
    g.gain.exponentialRampToValueAtTime(0.001, t + i * 0.08 + 0.15);
    osc.connect(g); g.connect(audioCtx.destination); osc.start(t + i * 0.08); osc.stop(t + i * 0.08 + 0.15);
  });
}

function switchWeapon(w) {

// ---------- 射击 ----------
const raycaster = new THREE.Raycaster();
function shoot() {
  const w = WEAPONS[STATE.currentWeapon];
  const now = performance.now();
  if (now - STATE.lastShot < w.fireRate) return;
  if (STATE.reloading) return;
  if (STATE.ammo[STATE.currentWeapon] <= 0) { tryReload(); return; }
  STATE.lastShot = now;
  STATE.ammo[STATE.currentWeapon]--;
  STATE.shotsFired++;
  updateHUD();
  playShot(STATE.currentWeapon);

  // 枪口火焰
  const flash = document.getElementById('muzzle-flash');
  flash.style.opacity = '1';
  setTimeout(() => { flash.style.opacity = '0'; }, 50);

  // 后坐力
  const recoil = STATE.currentWeapon === 'sniper' ? 0.03 : STATE.currentWeapon === 'shotgun' ? 0.04 : 0.012;
  player.pitch += recoil + Math.random() * 0.008;
  player.yaw += (Math.random() - 0.5) * 0.008;

  // 多弹丸（霰弹枪）
  const spreadMult = STATE.aiming ? 0.4 : 1;
  for (let p = 0; p < w.pellets; p++) {
    const dir = new THREE.Vector3();
    camera.getWorldDirection(dir);
    dir.x += (Math.random() - 0.5) * w.spread * spreadMult;
    dir.y += (Math.random() - 0.5) * w.spread * spreadMult;
    dir.z += (Math.random() - 0.5) * w.spread * spreadMult;
    dir.normalize();

    raycaster.set(camera.position, dir);
    raycaster.far = 100;

    const enemyMeshes = STATE.enemies.filter(e => e.alive).map(e => e.mesh);
    const hits = raycaster.intersectObjects(enemyMeshes, true);

    if (hits.length > 0) {
      let obj = hits[0].object;
      while (obj && !obj.userData.enemyRef) obj = obj.parent;
      if (obj && obj.userData.enemyRef) {
        const enemy = obj.userData.enemyRef;
        STATE.shotsHit++;
        enemy.hp -= w.damage;
        playHit();
        showHitMarker();
        enemy.mesh.traverse(c => {
          if (c.isMesh && c.material.emissive) {
            c.material.emissive.setHex(0xff4444);
            setTimeout(() => c.material.emissive.setHex(0x000000), 80);
          }
        });
        if (enemy.hp <= 0) killEnemy(enemy);
      }
    }

    // 弹孔
    const allHits = raycaster.intersectObjects(obstacles.map(o => o.mesh).concat([ground]));
    if (allHits.length > 0 && (!hits.length || allHits[0].distance < hits[0].distance)) {
      const pt = allHits[0].point;
      const hole = new THREE.Mesh(
        new THREE.CircleGeometry(0.08, 8),
        new THREE.MeshBasicMaterial({ color: 0x111111, side: THREE.DoubleSide })
      );
      hole.position.copy(pt).add(allHits[0].face.normal.clone().multiplyScalar(0.01));
      hole.lookAt(pt.clone().add(allHits[0].face.normal));
      scene.add(hole);
      setTimeout(() => scene.remove(hole), 8000);
    }
  }
}

function showHitMarker() {
  const hm = document.getElementById('hit-marker');
  hm.style.opacity = '1';
  setTimeout(() => { hm.style.opacity = '0'; }, 120);
}

function tryReload() {
  const w = WEAPONS[STATE.currentWeapon];
  if (STATE.reloading || STATE.ammo[STATE.currentWeapon] === w.magSize) return;
  STATE.reloading = true;
  document.getElementById('reload-indicator').style.display = 'block';
  playReload();
  setTimeout(() => {
    STATE.ammo[STATE.currentWeapon] = w.magSize;
    STATE.reloading = false;
    document.getElementById('reload-indicator').style.display = 'none';
    updateHUD();
  }, w.reloadTime);
}

// ---------- 手雷 ----------
const grenadeGeo = new THREE.SphereGeometry(0.12, 8, 8);
const grenadeMat = new THREE.MeshStandardMaterial({ color: 0x3a5a2a, roughness: 0.6, metalness: 0.4 });

function throwGrenade() {
  const now = performance.now();
  if (now - STATE.lastGrenade < 600) return;
  STATE.lastGrenade = now;
  const dir = new THREE.Vector3();
  camera.getWorldDirection(dir);
  const grenade = {
    mesh: new THREE.Mesh(grenadeGeo, grenadeMat),
    vel: dir.clone().multiplyScalar(18).add(new THREE.Vector3(0, 4, 0)),
    pos: camera.position.clone().add(dir.clone().multiplyScalar(1)),
    fuse: 2.0,
    alive: true,
  };
  grenade.mesh.position.copy(grenade.pos);
  grenade.mesh.castShadow = true;
  scene.add(grenade.mesh);
  STATE.grenades.push(grenade);
}

function updateGrenades(dt) {
  for (const g of STATE.grenades) {
    if (!g.alive) continue;
    g.fuse -= dt;
    g.vel.y -= 25 * dt;
    const newPos = g.pos.clone().add(g.vel.clone().multiplyScalar(dt));
    if (newPos.y < 0.12) {
      newPos.y = 0.12;
      g.vel.y *= -0.4;
      g.vel.x *= 0.7;
      g.vel.z *= 0.7;
    }
    if (collidesAt(newPos.x, g.pos.z, 0.12)) { g.vel.x *= -0.5; newPos.x = g.pos.x; }
    if (collidesAt(g.pos.x, newPos.z, 0.12)) { g.vel.z *= -0.5; newPos.z = g.pos.z; }
    g.pos.copy(newPos);
    g.mesh.position.copy(g.pos);
    g.mesh.rotation.x += dt * 8;
    g.mesh.rotation.y += dt * 6;
    if (g.fuse <= 0) explodeGrenade(g);
  }
  STATE.grenades = STATE.grenades.filter(g => g.alive);
}

function explodeGrenade(g) {
  g.alive = false;
  scene.remove(g.mesh);
  playExplosion();
  const explosion = new THREE.Mesh(
    new THREE.SphereGeometry(0.5, 12, 12),
    new THREE.MeshBasicMaterial({ color: 0xffaa33, transparent: true, opacity: 0.9 })
  );
  explosion.position.copy(g.pos);
  scene.add(explosion);
  let scale = 0.5;
  const expand = setInterval(() => {
    scale += 1.5;
    explosion.scale.setScalar(scale);
    explosion.material.opacity = Math.max(0, 0.9 - scale / 10);
    if (scale > 8) { clearInterval(expand); scene.remove(explosion); }
  }, 16);

  const radius = 6;
  const maxDamage = 100;
  for (const enemy of STATE.enemies) {
    if (!enemy.alive) continue;
    const dist = g.pos.distanceTo(enemy.mesh.position.clone().setY(g.pos.y));
    if (dist < radius) {
      enemy.hp -= maxDamage * (1 - dist / radius);
      if (enemy.hp <= 0) killEnemy(enemy);
    }
  }
  const playerDist = g.pos.distanceTo(player.pos);
  if (playerDist < radius) {
    damagePlayer(maxDamage * 0.4 * (1 - playerDist / radius));
  }
}

// ---------- 道具 ----------
const PICKUP_TYPES = {
  health: { color: 0x33ff66, label: '医疗包 +50 HP' },
  speed:  { color: 0xffcc33, label: '加速药剂 10秒' },
  shield: { color: 0x33aaff, label: '能量护盾 +50' },
};

function spawnPickup() {
  if (STATE.pickups.length >= 6) return;
  const types = Object.keys(PICKUP_TYPES);
  const type = types[Math.floor(Math.random() * types.length)];
  let x, z, tries = 0;
  do {
    x = (Math.random() - 0.5) * 80;
    z = (Math.random() - 0.5) * 80;
    tries++;
  } while ((collidesAt(x, z) || Math.hypot(x - player.pos.x, z - player.pos.z) < 8) && tries < 30);
  if (tries >= 30) return;

  const info = PICKUP_TYPES[type];
  const group = new THREE.Group();
  const base = new THREE.Mesh(
    new THREE.CylinderGeometry(0.5, 0.6, 0.15, 16),
    new THREE.MeshStandardMaterial({ color: 0x222233, metalness: 0.5, roughness: 0.5 })
  );
  base.position.y = 0.075;
  group.add(base);
  let body;
  if (type === 'health') {
    body = new THREE.Mesh(
      new THREE.BoxGeometry(0.5, 0.5, 0.15),
      new THREE.MeshStandardMaterial({ color: info.color, emissive: info.color, emissiveIntensity: 0.5, roughness: 0.3 })
    );
    body.position.y = 0.6;
    const cross = new THREE.Mesh(
      new THREE.BoxGeometry(0.15, 0.5, 0.17),
      new THREE.MeshStandardMaterial({ color: 0xffffff })
    );
    cross.position.y = 0.6;
    body.add(cross);
  } else if (type === 'speed') {
    body = new THREE.Mesh(
      new THREE.ConeGeometry(0.3, 0.7, 6),
      new THREE.MeshStandardMaterial({ color: info.color, emissive: info.color, emissiveIntensity: 0.5, roughness: 0.3 })
    );
    body.position.y = 0.65;
  } else {
    body = new THREE.Mesh(
      new THREE.OctahedronGeometry(0.35),
      new THREE.MeshStandardMaterial({ color: info.color, emissive: info.color, emissiveIntensity: 0.5, roughness: 0.2, metalness: 0.6 })
    );
    body.position.y = 0.65;
  }
  group.add(body);
  const light = new THREE.PointLight(info.color, 0.8, 4);
  light.position.y = 0.8;
  group.add(light);

  group.position.set(x, 0, z);
  scene.add(group);
  STATE.pickups.push({ mesh: group, type, body, spin: Math.random() * Math.PI * 2 });
}

function updatePickups(dt) {
  for (const p of STATE.pickups) {
    p.spin += dt * 2;
    p.body.rotation.y = p.spin;
    p.body.position.y = 0.6 + Math.sin(p.spin * 1.5) * 0.1;
    const dist = Math.hypot(p.mesh.position.x - player.pos.x, p.mesh.position.z - player.pos.z);
    if (dist < 1.2) {
      applyPickup(p.type);
      scene.remove(p.mesh);
      p.collected = true;
    }
  }
  STATE.pickups = STATE.pickups.filter(p => !p.collected);
}

function applyPickup(type) {
  playPickup();
  showToast(PICKUP_TYPES[type].label);
  if (type === 'health') {
    STATE.health = Math.min(STATE.maxHealth, STATE.health + 50);
  } else if (type === 'speed') {
    STATE.buffs.speed = 10;
  } else if (type === 'shield') {
    STATE.shield = STATE.maxShield;
    STATE.buffs.shield = 10;
  }
  updateHUD();
  updateBuffs();
}

function showToast(text) {
  const t = document.getElementById('pickup-toast');
  t.textContent = text;
  t.style.opacity = '1';
  setTimeout(() => { t.style.opacity = '0'; }, 1500);
}

function updateBuffs() {
  const container = document.getElementById('buffs');
  container.innerHTML = '';
  if (STATE.buffs.speed > 0) {
    container.innerHTML += `<div class="buff-tag speed"><span class="buff-icon"></span>加速 ${Math.ceil(STATE.buffs.speed)}s</div>`;
  }
  if (STATE.buffs.shield > 0 || STATE.shield > 0) {
    container.innerHTML += `<div class="buff-tag shield"><span class="buff-icon"></span>护盾 ${Math.ceil(STATE.shield)}</div>`;
  }
}

const enemyGeoBody = new THREE.CapsuleGeometry(0.5, 1.2, 4, 8);

const enemyMatHead = new THREE.MeshStandardMaterial({ color: 0xff5555, roughness: 0.4, emissive: 0x000000 });

function spawnEnemy() {

  eyeL.position.set(-0.12, 2.15, 0.3); group.add(eyeL);

  let x, z;
  do {
    x = (Math.random() - 0.5) * 80;

  scene.add(group);
  const enemy = {
    mesh: group, hp: 100, alive: true,
    speed: 2.5 + Math.random() * 1.5 + STATE.wave * 0.2,
    damage: 8 + STATE.wave, attackCooldown: 0, attackRange: 2.2,
  };
  group.userData.enemyRef = enemy;
  STATE.enemies.push(enemy);
}

function killEnemy(enemy) {
  enemy.alive = false;
  STATE.score++;
  playEnemyDie();
  const mesh = enemy.mesh;
  let rot = 0;
  const fall = setInterval(() => {
    rot += 0.15;
    mesh.rotation.x = rot;
    mesh.position.y = Math.max(-0.5, mesh.position.y - 0.05);
    if (rot >= Math.PI / 2) {
      clearInterval(fall);
      setTimeout(() => { scene.remove(mesh); STATE.enemies = STATE.enemies.filter(e => e !== enemy); }, 1500);
    }
  }, 16);
  updateHUD();
  checkWaveComplete();
}

function updateEnemies(dt) {
  for (const enemy of STATE.enemies) {
    if (!enemy.alive) continue;
    const mesh = enemy.mesh;
    const dx = player.pos.x - mesh.position.x;
    const dz = player.pos.z - mesh.position.z;
    const dist = Math.hypot(dx, dz);
    mesh.rotation.y = Math.atan2(dx, dz);
    if (dist > enemy.attackRange) {
      const nx = dx / dist, nz = dz / dist;
      const newX = mesh.position.x + nx * enemy.speed * dt;
      const newZ = mesh.position.z + nz * enemy.speed * dt;
      if (!collidesAt(newX, mesh.position.z, 0.5)) mesh.position.x = newX;
      if (!collidesAt(mesh.position.x, newZ, 0.5)) mesh.position.z = newZ;
      mesh.position.y = Math.sin(performance.now() * 0.005 + mesh.position.x) * 0.1;
    } else {
      enemy.attackCooldown -= dt;
      if (enemy.attackCooldown <= 0) {
        enemy.attackCooldown = 1.0;
        damagePlayer(enemy.damage);
      }
    }
  }
}

// ---------- 玩家受伤 ----------
function damagePlayer(amount) {
  if (STATE.shield > 0) {
    const absorbed = Math.min(STATE.shield, amount * 0.7);
    STATE.shield -= absorbed;
    amount -= absorbed;
    if (STATE.shield <= 0) { STATE.shield = 0; STATE.buffs.shield = 0; }
  }
  STATE.health -= amount;
  playHurt();
  const overlay = document.getElementById('damage-overlay');
  overlay.style.boxShadow = 'inset 0 0 120px rgba(255,0,0,0.6)';
  setTimeout(() => { overlay.style.boxShadow = 'inset 0 0 120px rgba(255,0,0,0)'; }, 300);
  updateHUD();
  updateBuffs();
  if (STATE.health <= 0) { STATE.health = 0; gameOver(); }
}

// ---------- 波次 ----------
function spawnWave() {
  const count = 3 + STATE.wave * 2;
  for (let i = 0; i < count; i++) setTimeout(() => spawnEnemy(), i * 400);
}
function checkWaveComplete() {
  const alive = STATE.enemies.filter(e => e.alive).length;
  if (alive === 0 && STATE.playing) {
    STATE.wave++;
    STATE.health = Math.min(STATE.health + 25, STATE.maxHealth);
    updateHUD();
    setTimeout(() => spawnWave(), 2000);
  }
}

// ---------- 小地图 ----------
const minimapCanvas = document.getElementById('minimap');
const minimapCtx = minimapCanvas.getContext('2d');
const MAP_RANGE = 50;
const MAP_SIZE = 160;

function updateMinimap() {
  const ctx = minimapCtx;
  const cx = MAP_SIZE / 2, cy = MAP_SIZE / 2;
  const scale = MAP_SIZE / (MAP_RANGE * 2);
  ctx.fillStyle = 'rgba(10,10,25,0.8)';
  ctx.fillRect(0, 0, MAP_SIZE, MAP_SIZE);
  ctx.strokeStyle = 'rgba(255,255,255,0.06)';
  ctx.lineWidth = 1;
  for (let i = 0; i <= 10; i++) {
    const p = i * MAP_SIZE / 10;
    ctx.beginPath(); ctx.moveTo(p, 0); ctx.lineTo(p, MAP_SIZE); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(0, p); ctx.lineTo(MAP_SIZE, p); ctx.stroke();
  }
  ctx.fillStyle = 'rgba(120,120,160,0.4)';
  for (const ob of obstacles) {
    if (ob.height < 1) continue;
    const x = cx + (ob.minX + ob.maxX) / 2 * scale;
    const y = cy + (ob.minZ + ob.maxZ) / 2 * scale;
    const w = (ob.maxX - ob.minX) * scale;
    const h = (ob.maxZ - ob.minZ) * scale;
    ctx.fillRect(x - w/2, y - h/2, w, h);
  }
  for (const p of STATE.pickups) {
    const x = cx + p.mesh.position.x * scale;
    const y = cy + p.mesh.position.z * scale;
    const color = '#' + PICKUP_TYPES[p.type].color.toString(16).padStart(6, '0');
    ctx.fillStyle = color;
    ctx.beginPath(); ctx.arc(x, y, 3, 0, Math.PI * 2); ctx.fill();
  }
  ctx.fillStyle = '#ff3333';
  for (const e of STATE.enemies) {
    if (!e.alive) continue;
    const x = cx + e.mesh.position.x * scale;
    const y = cy + e.mesh.position.z * scale;
    ctx.fillRect(x - 2.5, y - 2.5, 5, 5);
  }
  ctx.save();
  ctx.translate(cx + player.pos.x * scale, cy + player.pos.z * scale);
  ctx.rotate(-player.yaw);
  ctx.fillStyle = '#ffffff';
  ctx.beginPath();
  ctx.moveTo(0, -6);
  ctx.lineTo(4, 5);
  ctx.lineTo(-4, 5);
  ctx.closePath();
  ctx.fill();
  ctx.restore();
  ctx.strokeStyle = 'rgba(255,255,255,0.2)';
  ctx.lineWidth = 2;
  ctx.strokeRect(0, 0, MAP_SIZE, MAP_SIZE);
}

// ---------- HUD ----------
function updateHUD() {
  document.getElementById('health-text').textContent = Math.ceil(STATE.health);
  document.getElementById('health-bar').style.width = (STATE.health / STATE.maxHealth * 100) + '%';
  const shieldWrap = document.getElementById('shield-bar-wrap');
  if (STATE.shield > 0) {
    shieldWrap.style.display = 'block';
    document.getElementById('shield-bar').style.width = (STATE.shield / STATE.maxShield * 100) + '%';
  } else {
    shieldWrap.style.display = 'none';
  }
  document.getElementById('ammo-current').textContent = STATE.ammo[STATE.currentWeapon];
  document.getElementById('score-text').textContent = STATE.score;
  document.getElementById('wave-text').textContent = STATE.wave;
}

// ---------- 游戏循环 ----------
const clock = new THREE.Clock();
let weaponBob = 0;
let pickupTimer = 0;

function animate() {
  requestAnimationFrame(animate);
  const dt = Math.min(clock.getDelta(), 0.05);

  if (STATE.playing) {
    if (STATE.buffs.speed > 0) { STATE.buffs.speed -= dt; if (STATE.buffs.speed <= 0) updateBuffs(); }
    if (STATE.buffs.shield > 0) { STATE.buffs.shield -= dt; if (STATE.buffs.shield <= 0) updateBuffs(); }

    const forward = new THREE.Vector3(-Math.sin(player.yaw), 0, -Math.cos(player.yaw));
    const right = new THREE.Vector3(Math.cos(player.yaw), 0, -Math.sin(player.yaw));
    const move = new THREE.Vector3();
    if (keys['KeyW']) move.add(forward);
    if (keys['KeyS']) move.sub(forward);
    if (keys['KeyD']) move.add(right);
    if (keys['KeyA']) move.sub(right);
    if (move.lengthSq() > 0) move.normalize();

    const sprint = keys['ShiftLeft'] || keys['ShiftRight'];
    let speed = player.speed * (sprint ? player.sprintMult : 1);
    if (STATE.buffs.speed > 0) speed *= 1.5;
    if (STATE.aiming) speed *= 0.6;

    const newX = player.pos.x + move.x * speed * dt;
    const newZ = player.pos.z + move.z * speed * dt;
    if (!collidesAt(newX, player.pos.z)) player.pos.x = newX;
    if (!collidesAt(player.pos.x, newZ)) player.pos.z = newZ;

    if (keys['Space'] && player.onGround) { player.vel.y = player.jumpVel; player.onGround = false; }
    player.vel.y -= player.gravity * dt;
    player.pos.y += player.vel.y * dt;
    if (player.pos.y <= 1.7) { player.pos.y = 1.7; player.vel.y = 0; player.onGround = true; }

    if (mouseDown && mouseLocked && WEAPONS[STATE.currentWeapon].auto) shoot();

    camera.position.copy(player.pos);
    camera.rotation.order = 'YXZ';
    camera.rotation.y = player.yaw;
    camera.rotation.x = player.pitch;

    if (move.lengthSq() > 0 && player.onGround) {
      weaponBob += dt * (sprint ? 14 : 10);
    }
    const bobY = Math.sin(weaponBob) * (sprint ? 8 : 5);
    const bobX = Math.cos(weaponBob * 0.5) * (sprint ? 6 : 3);
    const weaponView = document.getElementById('weapon-view');
    if (!STATE.aiming) {
      weaponView.style.transform = `translate(${bobX}px, ${bobY}px)`;
    }

    updateEnemies(dt);
    updateGrenades(dt);
    updatePickups(dt);
    updateMinimap();

    pickupTimer += dt;
    if (pickupTimer > 8) { pickupTimer = 0; spawnPickup(); }
  }

  renderer.render(scene, camera);
}

// ---------- 游戏控制 ----------
function startGame() {
  initAudio();
  STATE.playing = true;
  STATE.health = 100; STATE.shield = 0;
  STATE.ammo = { rifle: 30, pistol: 12, shotgun: 6, sniper: 5 };
  STATE.currentWeapon = 'rifle';
  STATE.score = 0; STATE.wave = 1;
  STATE.shotsFired = 0; STATE.shotsHit = 0;
  STATE.reloading = false; STATE.aiming = false;
  STATE.buffs = { speed: 0, shield: 0 };
  STATE.grenades.forEach(g => scene.remove(g.mesh)); STATE.grenades = [];
  STATE.pickups.forEach(p => scene.remove(p.mesh)); STATE.pickups = [];
  STATE.enemies.forEach(e => scene.remove(e.mesh)); STATE.enemies = [];
  player.pos.set(0, 1.7, 20); player.vel.set(0, 0, 0);
  player.yaw = 0; player.pitch = 0;
  document.body.classList.remove('ads', 'sniper');
  document.getElementById('weapon-view').innerHTML = WEAPON_SVGS.rifle;
  document.getElementById('weapon-name').textContent = '突击步枪';
  document.querySelectorAll('.weapon-slot').forEach(el => el.classList.toggle('active', el.dataset.w === 'rifle'));
  document.getElementById('reload-indicator').style.display = 'none';
  document.getElementById('start-screen').style.display = 'none';
  document.getElementById('game-over').style.display = 'none';
  document.getElementById('hud').style.display = 'block';
  updateCameraFov();
  updateHUD();
  updateBuffs();
  canvas.requestPointerLock();
  setTimeout(() => { spawnWave(); spawnPickup(); spawnPickup(); }, 1000);
}

function gameOver() {
  STATE.playing = false;
  document.exitPointerLock();
  document.body.classList.remove('ads', 'sniper');
  document.getElementById('hud').style.display = 'none';
  document.getElementById('final-kills').textContent = STATE.score;
  document.getElementById('final-wave').textContent = STATE.wave;
  const acc = STATE.shotsFired > 0 ? Math.round(STATE.shotsHit / STATE.shotsFired * 100) : 0;
  document.getElementById('final-accuracy').textContent = acc + '%';
  document.getElementById('game-over').style.display = 'flex';
}

document.getElementById('btn-start').addEventListener('click', startGame);
document.getElementById('btn-restart').addEventListener('click', startGame);

window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});

document.getElementById('weapon-view').innerHTML = WEAPON_SVGS.rifle;
animate();
</script>
